    <!-- Load Google Fonts asynchronously — does NOT block window load event.
         The rel="preload" + onload trick: preload fetches the CSS immediately
         without blocking, then onload switches it to a real stylesheet.
         This prevents WOFF2 font files from keeping the browser loading bar
         active after our preloader has already finished. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@700;800;900&display=swap"

    <style id="preloader-static-style">
      .preloader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100%;
        height: 100dvh;
        z-index: 99999;
        background: rgba(3, 8, 16, 0.99) !important;
        pointer-events: all;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
      }
      .preloader-overlay.exit {
        animation: preloader-fadeOut 0.2s ease-out forwards;
      }
      @keyframes preloader-fadeOut {
        from { opacity: 1; }
        to { opacity: 0; visibility: hidden; }
      }
      .preloader-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        animation: preloader-fadeIn 0.6s ease both;
      }
      @keyframes preloader-fadeIn {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .preloader-hexWrap {
        position: relative;
        width: 72px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-hexSvg {
        width: 72px;
        height: 80px;
        animation: preloader-hexRotate 8s linear infinite;
        filter: drop-shadow(0 0 12px rgba(13, 211, 240, 0.4));
      }
      @keyframes preloader-hexRotate {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .preloader-hexInner {
        animation: preloader-hexPulse 2.2s ease-in-out infinite;
      }
      @keyframes preloader-hexPulse {
        0%, 100% { opacity: 0.4; }
        50%       { opacity: 1; }
      }
      .preloader-pulseRing {
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 1.5px solid rgba(13, 211, 240, 0.25);
        animation: preloader-ringExpand 2s ease-out infinite;
      }
      @keyframes preloader-ringExpand {
        0%   { transform: scale(0.85); opacity: 0.6; }
        100% { transform: scale(1.4);  opacity: 0; }
      }
      .preloader-wordmark {
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .preloader-wordmarkImg {
        height: clamp(36px, 8vw, 50px);
        width: auto;
        display: block;
        filter: drop-shadow(0 0 12px rgba(13, 211, 240, 0.45));
      }
      .preloader-tagline {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.82rem;
        font-weight: 400;
        color: #8aacbf;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        animation: preloader-fadeIn 0.6s 0.2s ease both;
      }
      .preloader-progressTrack {
        position: absolute;
        bottom: 2.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: min(280px, 60vw);
        height: 1px;
        background: rgba(37, 150, 190, 0.12);
        border-radius: 1px;
        overflow: hidden;
      }
      .preloader-progressIndeterminate {
        position: absolute;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, #0dd3f0, transparent);
        border-radius: 1px;
        animation: preloader-shimmer 1.4s ease-in-out infinite;
        box-shadow: 0 0 8px rgba(13, 211, 240, 0.5);
      }
      @keyframes preloader-shimmer {
        0%   { left: -40%; }
        100% { left: 140%; }
      }
    </style>

    <div id="preloader-static" class="preloader-overlay" aria-hidden="true">

            <defs>
              <linearGradient id="hexGradStatic" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#0dd3f0" />

        <p class="preloader-tagline">I make your story move.</p>
