<!DOCTYPE html>
<html lang="en" style="background:#04080c">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: proper display on notched iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="AP Media — video editor specializing in commercial clips, music videos, and viral social media content. Watch the portfolio and get in touch." />
    <meta name="author" content="AP Media" />
    <link rel="canonical" href="https://apmedia.pages.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AP Media" />
    <meta property="og:url" content="https://apmedia.pages.dev/" />
    <meta property="og:title" content="AP Media — Video Editor Portfolio" />
    <meta property="og:description" content="I make your story move. Commercial clips, music videos and viral social media content." />
    <meta property="og:image" content="https://apmedia.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AP Media — Video Editor Portfolio" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="bg_BG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AP Media — Video Editor Portfolio" />
    <meta name="twitter:description" content="I make your story move. Commercial clips, music videos and viral social media content." />
    <meta name="twitter:image" content="https://apmedia.pages.dev/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Structured data — helps Google show a rich result for the editor -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alex",
        "alternateName": "AP Media",
        "jobTitle": "Video Editor",
        "url": "https://apmedia.pages.dev/",
        "image": "https://apmedia.pages.dev/og-image.png",
        "email": "mailto:alexperchinkov77@gmail.com",
        "sameAs": ["https://www.instagram.com/alex.cc077/"],
        "knowsAbout": ["Video Editing", "Motion Graphics", "Color Grading", "Adobe Premiere Pro", "After Effects", "Social Media Content"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to GitHub Pages CDN so video metadata requests are faster -->
    <link rel="preconnect" href="https://itsnotsimple.github.io" crossorigin />
    <!-- Load Google Fonts asynchronously — does NOT block window load event.
         The rel="preload" + onload trick: preload fetches the CSS immediately
         without blocking, then onload switches it to a real stylesheet.
         This prevents WOFF2 font files from keeping the browser loading bar
         active after our preloader has already finished. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@700;800;900&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
    </noscript>

    <title>AP Media — Video Editor Portfolio</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- ERUDA: Mobile DevTools — активира се само с ?debug=1 в URL-а -->
    <script>
      if (window.location.search.includes('debug=1')) {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/eruda';
        script.onload = function() {
          eruda.init();
        };
        document.head.appendChild(script);
      }
    </script>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "c505fb15e01a4aa2a8dd0a5eee735c7f"}'></script>
    <!-- End Cloudflare Web Analytics -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
