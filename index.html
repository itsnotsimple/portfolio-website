<!DOCTYPE html>
<html lang="en" style="background:#04080c">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: proper display on notched iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Video editor specializing in commercial clips, music videos, and social media content. View the portfolio and get in touch." />
    <meta property="og:title" content="Alex & Flow — Video Editor Portfolio" />
    <meta property="og:description" content="I make your story move. Commercial clips, music videos, social media." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to GitHub Pages CDN so video metadata requests are faster -->
    <link rel="preconnect" href="https://itsnotsimple.github.io" crossorigin />
    <!-- Load Google Fonts asynchronously — does NOT block window load event.
         The rel="preload" + onload trick: preload fetches the CSS immediately
         without blocking, then onload switches it to a real stylesheet.
         This prevents WOFF2 font files from keeping the browser loading bar
         active after our preloader has already finished. -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@700;800;900&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Inter:wght@300;400;500;600;700;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
    </noscript>

    <title>Alex & Flow — Video Editor Portfolio</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- ERUDA: Mobile DevTools — активира се само с ?debug=1 в URL-а -->
    <script>
      if (window.location.search.includes('debug=1')) {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/eruda';
        script.onload = function() {
          eruda.init();
        };
        document.head.appendChild(script);
      }
    </script>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "%VITE_CLOUDFLARE_TOKEN%"}'></script>
    <!-- End Cloudflare Web Analytics -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
