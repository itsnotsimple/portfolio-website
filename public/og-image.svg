<!-- Social share template (1200×630). Export this to og-image.jpg and the meta tags in index.html will use it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04080c"/>
      <stop offset="1" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2596be"/>
      <stop offset="1" stop-color="#0dd3f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#2596be" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2596be" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="380" fill="url(#glow)"/>
  <circle cx="200" cy="600" r="320" fill="url(#glow)" opacity="0.5"/>

  <!-- Logo: hexagon + play -->
  <g transform="translate(80,66)">
    <path d="M40 0 H100 L130 52 L100 104 H40 L10 52 Z" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M55 30 L95 52 L55 74 Z" fill="url(#brand)"/>
  </g>
  <text x="240" y="155" font-family="'Bebas Neue', Impact, sans-serif" font-size="92" fill="#f0f6fb" letter-spacing="3">ALEX <tspan fill="#2596be">&amp;</tspan> FLOW</text>

  <text x="85" y="365" font-family="'Inter', Arial, sans-serif" font-size="68" font-weight="800" fill="#f0f6fb">I make your story move.</text>
  <text x="85" y="430" font-family="'Inter', Arial, sans-serif" font-size="30" fill="#8aacbf">Commercial campaigns · Music videos · Social media</text>
  <text x="85" y="548" font-family="'Inter', Arial, sans-serif" font-size="30" font-weight="600" fill="#2596be">@alex.cc077</text>
</svg>
